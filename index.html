<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity – VS Code‑style UI</title>
  <meta name="description" content="Antigravity UI that mimics the Visual Studio Code IDE layout with a premium dark theme." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <!-- Activity Bar -->
  <aside id="activityBar">
    <button class="activity-icon" id="explorerToggle" title="Explorer">🗂️</button>
    <button class="activity-icon" id="terminalToggle" title="Terminal">💻</button>
    <button class="activity-icon" id="settingsToggle" title="Settings">⚙️</button>
  </aside>

  <!-- Side Bar (Explorer) -->
  <nav id="sideBar" class="panel hidden">
    <header class="panel-header">Explorer</header>
    <div class="panel-content">
      <p class="placeholder">File explorer placeholder</p>
    </div>
  </nav>

  <!-- Main Editor / Chat Area -->
  <main id="editor">
    <section id="chatContainer">
      <div id="messages" class="messages"></div>
      <form id="chatForm" class="chat-form">
        <textarea id="messageInput" rows="2" placeholder="Type a message…"></textarea>
        <button type="submit" class="send-btn">Send</button>
      </form>
    </section>
  </main>

  <!-- Terminal Panel -->
  <footer id="terminalPanel" class="panel hidden">
    <header class="panel-header">Terminal</header>
    <div class="panel-content">
      <p class="placeholder">Terminal mock‑up (non‑functional)</p>
    </div>
  </footer>

  <!-- Status Bar -->
  <footer id="statusBar">
    <span>Antigravity UI • Ready</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
